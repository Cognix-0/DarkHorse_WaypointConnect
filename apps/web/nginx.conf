server {
  listen 80;
  root /usr/share/nginx/html;
  location = /manifest.webmanifest { types { } default_type application/manifest+json; }
  # The service worker and the page must never be cached by the browser, or phones keep an old app.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  # Deployed build id (src/live.tsx compares it with the running app).
  location = /version.json { add_header Cache-Control "no-store"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  # Phone app download (docs/mobile.md) and the Android app-link file. Missing files are a real 404, not the app page.
  location /downloads/ {
    types { application/vnd.android.package-archive apk; }
    add_header Content-Disposition "attachment";
    try_files $uri =404;
  }
  location = /.well-known/assetlinks.json { default_type application/json; try_files $uri =404; }
  # Single-page app: every unknown path serves index.html.
  location / { try_files $uri /index.html; }
}
