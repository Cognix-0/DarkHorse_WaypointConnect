<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Waypoint Driver</title></head>
<body style="margin:0;font-family:system-ui,sans-serif;background:#0F172A;color:#fff;display:grid;place-items:center;height:100vh;text-align:center;padding:24px">
  <div>
    <h1 style="font-size:20px">No connection yet</h1>
    <p style="color:#94A3B8">Open the app once with signal so your route is saved on this phone. After that it works offline.</p>
    <button onclick="location.reload()" style="margin-top:12px;padding:12px 20px;border:0;border-radius:10px;background:#2A4BD7;color:#fff;font-size:16px">Try again</button>
  </div>
</body>
</html>
