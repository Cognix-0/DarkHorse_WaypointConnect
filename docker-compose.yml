# `docker compose up` starts the whole stack: database, API (with schema sync + seed), web app, HTTPS proxy.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-waypoint}
      POSTGRES_DB: waypoint
    volumes: [pgdata:/var/lib/postgresql/data]
    # Reachable only from this machine (never the internet). 15432, an unusual port, so it does not clash with another
    # PostgreSQL on a laptop (5432, 5433 and 54322 are often taken). Teammates reach the server's copy through SSH (docs/deploy.md).
    ports: ["127.0.0.1:${DB_HOST_PORT:-15432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waypoint"]
      interval: 3s
      retries: 20

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-waypoint}@db:5432/waypoint
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      # Every account has its own password, derived from this secret (falls back to JWT_SECRET): pnpm credentials
      ACCOUNT_SECRET: ${ACCOUNT_SECRET:-}
      # Empty = every screen runs on today's date and the real Asia/Colombo time. Set them only to rehearse a fixed day.
      DEMO_DATE: ${DEMO_DATE:-}
      DEMO_MODE: ${DEMO_MODE:-1}
      DEMO_CLOCK: ${DEMO_CLOCK:-}
      DEMO_LOADER_CLOCK: ${DEMO_LOADER_CLOCK:-}
      DEMO_STORE_CLOCK: ${DEMO_STORE_CLOCK:-}
      API_PORT: 3000
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, web]
    restart: unless-stopped

volumes:
  pgdata: {}
  caddy_data: {}
