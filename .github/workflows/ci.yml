name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --no-frozen-lockfile   # switch to --frozen-lockfile once pnpm-lock.yaml is committed
      - run: pnpm test
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pip install pandas && pnpm check:2b
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
